{% extends 'widgets/widget_template.html' %}
{% block widget_content %}
  <style>
  .github .wf-table-horizontal { border: 1px solid; font-size: 12px; }
  .github .wf-table-horizontal th {
    text-align: center; border: 1px solid;
    text-transform: uppercase; font-weight: normal; padding: 5px;
  }
  .github .wf-table-horizontal td { border: 1px solid; padding: 5px; }
  .github .no-word-wrap { white-space: nowrap; }
  </style>
  <div class="github"
       style="overflow:auto;
              width:100%;
              height:100%;
              padding-left:10px;
              padding-right:10px">
    {% for result in results %}
      <br>
      <table class="wf-table-horizontal datatable">
        <thead>
          <tr>
            <th>Organization Name</th>
            <th>Team</th>
            <th>User</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <a class="no-word-wrap"
                 href="javascript:;"
                 onclick="context_menu(this, [{'contains': ['github organization name'], 'value':'{{ result.param.organization_name }}'}], 0, {{ container }}, null, false);">
                {{ result.param.organization_name }}&nbsp;<span class="fa fa-caret-down" style="font-size:smaller;"></span>
              </a>
            </td>
            <td>
              <a class="no-word-wrap"
                 href="javascript:;"
                 onclick="context_menu(this, [{'contains': ['github team name', 'github team id'], 'value':'{{ result.param.team }}'}], 0, {{ container }}, null, false);">
                {{ result.param.team }}&nbsp;<span class="fa fa-caret-down" style="font-size:smaller;"></span>
              </a>
            </td>
            <td>
              <a class="no-word-wrap"
                 href="javascript:;"
                 onclick="context_menu(this, [{'contains': ['github username'], 'value':'{{ result.param.user }}'}], 0, {{ container }}, null, false);">
                {{ result.param.user }}&nbsp;<span class="fa fa-caret-down" style="font-size:smaller;"></span>
              </a>
            </td>
            <td>{{ result.status }}</td>
          </tr>
        </tbody>
      </table>
    {% endfor %}
  </div>
  <script>
  $.extend(true, $.fn.dataTable.defaults, {
    "searching": false, "bLengthChange": false,
    "language": {"paginate": {"previous": "<i class='fa fa-angle-left fa-lg'></i>", "next": "<i class='fa fa-angle-right fa-lg'></i>"}},
    "dom": '<"top">rt<"bottom"p><"clear">',
    drawCallback: function(settings) {
      var pagination = $(this).closest('.dataTables_wrapper').find('.dataTables_paginate');
      pagination.toggle(this.api().page.info().pages > 1);
    }
  });
  $.fn.DataTable.ext.pager.numbers_length = 5;
  $('.datatable').DataTable();
  </script>
{% endblock %}
